[project]
name = "vesuvius-sweep"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Marko Letic", email = "7241522+mletic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "fsspec>=2026.9.0",
    "imagecodecs>=2026.10.10",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scipy",
    "tifffile>=2026.10.15",
    "zarr<3",
]

[project.scripts]
vesuvius-sweep = "vesuvius_sweep:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
